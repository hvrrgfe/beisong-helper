<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>边听边背</title>
<style>
:root{--bg:#f4f6f1;--card:#fff;--line:#e3e6dd;--ink:#2a2e26;--sub:#8b9084;
--accent:#4a7dd8;--green:#3f9d63;--yellow:#dd9f2d;--red:#d86860;--active:#fff8e1}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);
color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
select,button,textarea,input{font:inherit}
select,.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{opacity:.9;color:#fff}
.spacer{flex:1}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--card);
border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:17px;margin-right:4px}
#progWrap{display:none;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
#progBar{width:90px;height:8px;background:#e8ebe3;border-radius:4px;overflow:hidden}
#progFill{height:100%;background:var(--green);width:0%}
#stages{display:flex;gap:6px;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--line);
align-items:center;overflow-x:auto}
#stages button{border:1px solid transparent;background:none;padding:6px 12px;border-radius:18px;
cursor:pointer;color:var(--sub);white-space:nowrap}
#stages button.on{background:var(--active);color:#8a6d1f;font-weight:600}
#stages .rev{margin-left:auto}
#knobs{display:flex;gap:10px;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--line);
align-items:center;overflow-x:auto;font-size:13px;color:var(--sub);flex-wrap:wrap}
#knobs label{display:flex;align-items:center;gap:4px;white-space:nowrap}
#knobs select,#knobs input[type=range]{max-width:110px}
main{flex:1;overflow-y:auto;padding:14px;max-width:900px;width:100%;margin:0 auto}
.empty{color:var(--sub);text-align:center;padding:60px 20px;line-height:2}
.sent{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;
padding:12px 14px;margin-bottom:10px;align-items:flex-start}
.sent.now{border-color:var(--accent);box-shadow:0 2px 10px rgba(74,125,216,.18)}
.sent.ab{border-color:var(--yellow);box-shadow:0 0 0 2px rgba(221,159,45,.25)}
.sent.due .no{background:var(--active);color:#8a6d1f;font-weight:700}
.no{flex:none;width:26px;height:26px;border-radius:50%;background:var(--bg);display:flex;
align-items:center;justify-content:center;font-size:12px;color:var(--sub);margin-top:4px}
.body{flex:1;line-height:1.9;font-size:17px;word-break:break-word}
.note{display:block;font-size:13px;color:var(--sub);margin-bottom:2px}
.ops{flex:none;display:flex;align-items:center;gap:8px;margin-top:2px}
.ops .play{border:1px solid var(--line);border-radius:50%;width:32px;height:32px;background:#fff;cursor:pointer}
.ops .play:hover{border-color:var(--accent)}
.dot{width:14px;height:14px;border-radius:50%;border:1px solid #ccc;cursor:pointer;display:inline-block}
.dot.s1{background:var(--yellow);border-color:var(--yellow)}
.dot.s2{background:var(--green);border-color:var(--green)}
.gen{font-size:12px;color:var(--sub)}
.gap{display:inline-block;min-width:1.5em;text-align:center;background:#eef1ea;border-radius:4px;
color:#a0a49a;margin:0 1px;cursor:pointer;user-select:none;padding:0 2px}
.gap:hover{background:#e2e7db}
.gap.show{background:transparent;color:var(--green);font-weight:700}
.gapmask .body{filter:blur(0)}
.tools{display:flex;gap:8px;margin-bottom:10px;align-items:center;flex-wrap:wrap}
.tools .hint{font-size:12px;color:var(--sub)}
.dict .drow{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.dinput{width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;padding:8px;resize:vertical}
.dresult{margin-top:8px;line-height:2;min-height:1em;font-size:16px}
.ok{color:var(--green)} .bad{color:var(--red);border-bottom:2px solid var(--red)}
.miss{color:#aaa;border-bottom:2px dashed #ccc}
.dstat{margin-top:4px;font-size:13px;color:var(--sub)}
.opool,.oans{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.ocard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
cursor:pointer;line-height:1.8}
.ocard:hover{border-color:var(--accent)}
.ocard.picked{background:var(--active)}
.ocard.right{border-color:var(--green);background:#eaf6ee}
.ocard.wrong{border-color:var(--red);background:#fdeeee}
.ohint{color:var(--sub);padding:10px;border:2px dashed var(--line);border-radius:10px;text-align:center}
#pausePanel{display:none;background:var(--card);border:2px solid var(--accent);border-radius:14px;
padding:14px 18px;margin-bottom:12px;text-align:center}
#pausePanel .pp1{font-size:18px;font-weight:600;margin-bottom:8px}
#pauseBar{height:10px;background:#e8ebe3;border-radius:5px;overflow:hidden}
#pauseFill{height:100%;background:var(--accent);width:100%}
#pausePanel .pp2{font-size:13px;color:var(--sub);margin-top:6px}
.trk{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;
padding:12px 14px;margin-bottom:10px;align-items:center}
.trk .t{flex:1;line-height:1.6}
footer{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);
border-top:1px solid var(--line)}
footer .ctrl{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;
cursor:pointer;font-size:16px}
footer .ctrl.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
footer .ctrl.on{background:var(--yellow);color:#fff;border-color:var(--yellow)}
footer .ctrl:hover{border-color:var(--accent)}
#nowInfo{font-size:13px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flab{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:6px;white-space:nowrap}
dialog{border:none;border-radius:14px;padding:0;box-shadow:0 10px 40px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(0,0,0,.35)}
.dlg{width:min(640px,92vw);padding:18px;max-height:86vh;overflow:auto}
.dlg h3{margin-bottom:12px}
.frow{display:flex;align-items:center;gap:10px;margin:10px 0;flex-wrap:wrap}
.frow label{min-width:110px;color:var(--sub);font-size:14px}
.frow input[type=text],.frow select{flex:1;padding:6px 10px;border:1px solid var(--line);border-radius:8px}
.frow.btns{justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#333;color:#fff;
padding:8px 16px;border-radius:20px;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:80vw}
#toast.show{opacity:1}
.firstbody{cursor:pointer}
/* ---- 全屏 / 沉浸模式 ---- */
body.immersion header,body.immersion #stages,body.immersion #knobs{display:none}
body.immersion main{max-width:1100px;padding:4vh 8vw}
body.immersion .body{font-size:30px;line-height:2.1}
body.immersion .note{font-size:18px}
body.immersion .sent{background:transparent;border-color:transparent;padding:10px 0}
body.immersion .sent.now{background:var(--active);border-color:var(--accent)}
body.immersion footer{background:transparent;border-top:none}
body.immersion #sideToggle{position:fixed;left:12px;top:12px;z-index:121;background:var(--card)}
#immExit{display:none;position:fixed;right:12px;top:12px;z-index:121}
body.immersion #immExit{display:inline-block}
/* ---- 参考课件式：进度点条 / 总览 / 朗读中高亮 ---- */
#dots{display:flex;flex-wrap:wrap;gap:4px;padding:10px 12px;background:var(--card);
  border:1px solid var(--line);border-radius:12px;margin-bottom:10px;align-items:center}
#dots button{min-width:26px;height:26px;padding:0 5px;border:1px solid var(--line);border-radius:7px;
  background:#fff;color:var(--sub);font-size:12px;cursor:pointer}
#dots button:hover{border-color:var(--accent);color:var(--accent)}
#dots button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
#dots button.done{background:#eaf6ee;border-color:#bfe3cd;color:var(--green)}
#dots button.fuzzy{background:#fff8e1;border-color:#f0dca6;color:#a8862a}
#dots button.nowSpeak{box-shadow:0 0 0 2px rgba(74,125,216,.35)}
#dots .sep{width:1px;height:18px;background:var(--line);margin:0 4px}
.sent.speaking-now{background:var(--active);border-color:var(--accent)}
.ov-row{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);
  border-radius:10px;margin-bottom:6px;background:#fff}
.ov-row:hover{border-color:var(--accent)}
.ov-no{flex:none;width:26px;height:26px;border-radius:50%;background:var(--bg);display:flex;
  align-items:center;justify-content:center;font-size:12px;color:var(--sub)}
.ov-main{flex:1;line-height:1.7;font-size:15px}
.ov-note{font-size:12px;color:var(--sub)}
.ov-badge{flex:none;font-size:12px;color:var(--green)}
.ov-play{flex:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 8px;cursor:pointer}
/* ---- 开始界面 ---- */
#startScreen{position:fixed;inset:0;background:var(--bg);z-index:200;display:none;
  flex-direction:column;align-items:center;overflow:auto;padding:34px 16px}
#startScreen .ss-box{width:min(760px,94vw)}
#startScreen h1{font-size:26px;text-align:center;margin-bottom:22px}
.ss-step{color:var(--sub);font-size:14px;margin:16px 0 8px;font-weight:600}
.ss-dev{display:flex;gap:12px}
.ss-dev-btn{flex:1;padding:16px;font-size:18px;border:2px solid var(--line);border-radius:14px;
  background:#fff;cursor:pointer}
.ss-dev-btn.on{border-color:var(--accent);background:var(--active);color:#8a6d1f;font-weight:700}
.ss-cats{display:flex;gap:8px;flex-wrap:wrap}
.ss-cat{padding:8px 14px;border:1px solid var(--line);border-radius:18px;background:#fff;
  cursor:pointer;font-size:14px;color:var(--sub)}
.ss-cat.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.ss-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:4px}
.ss-mat{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;
  cursor:pointer;font-size:15px;text-align:left;line-height:1.5;min-height:44px;position:relative}
.ss-mat:hover{border-color:var(--accent)}
.ss-mat.sel{border-color:var(--accent);background:var(--active)}
.ss-mat.sel:after{content:'✓';position:absolute;right:10px;top:8px;color:var(--accent);font-weight:700}
.ss-bar{display:flex;gap:10px;align-items:center;margin-top:16px;padding:12px;background:#fff;
  border:1px solid var(--line);border-radius:12px;position:sticky;bottom:0}
#ssCount{color:var(--sub);font-size:14px;flex:1}
/* 电脑模式：真·桌面布局 */
#pcSide{display:none;position:fixed;left:0;top:0;bottom:0;width:272px;max-width:82vw;background:#fff;
  border-right:1px solid var(--line);overflow-y:auto;padding:14px 12px;z-index:120;
  transform:translateX(-105%);transition:transform .22s ease}
body.side-open #pcSide{display:block;transform:none;box-shadow:8px 0 28px rgba(0,0,0,.25)}
.sidebtn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:34px;
  padding:0;font-size:18px;flex:none}
.ps-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ps-head .ps-logo{margin-bottom:0}
.ps-logo{font-size:19px;font-weight:700;margin-bottom:14px}
.ps-sec{color:var(--sub);font-size:13px;margin:14px 0 6px;font-weight:600}
#psStages button{display:block;width:100%;text-align:left;padding:9px 12px;margin-bottom:4px;
  border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font-size:14px}
#psStages button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#psMats{padding-bottom:30px}
#psMats .pm{display:block;width:100%;text-align:left;padding:8px 10px;margin-bottom:3px;
  border:none;border-radius:8px;background:transparent;cursor:pointer;font-size:13.5px;line-height:1.4}
#psMats .pm:hover{background:var(--active)}
#psMats .pm.on{background:var(--active);color:#8a6d1f;font-weight:600}
#psMats .pm-cat{color:var(--sub);font-size:12px;margin:10px 0 4px;font-weight:700}
body.pc #pcSide{display:block}
body.pc main{max-width:none;padding:16px 28px;column-count:2;column-gap:20px}
body.pc .sent{break-inside:avoid;margin-bottom:14px}
body.pc .body{font-size:20px;line-height:2}
body.pc #nowInfo{font-size:15px}
body.pc footer .ctrl{width:50px;height:50px}
/* ---- TV 大屏模式（地址加 ?tv=1，或 UA 含 TV 自动进入）---- */
body.tv header,body.tv #stages{display:none}
body.tv{background:#101410;color:#f2f4ee}
body.tv main{max-width:1400px;padding:24px}
body.tv .body{font-size:40px;line-height:2.2}
body.tv .note{font-size:22px}
body.tv .sent{border-radius:18px;padding:22px 26px;margin-bottom:18px;border-width:2px;border-color:#3a4038;background:#1a201a}
body.tv .sent.now{border-color:var(--accent);box-shadow:0 4px 24px rgba(74,125,216,.4)}
body.tv .no{width:44px;height:44px;font-size:22px;background:#22281f;color:#c9cdbf}
body.tv footer,body.tv #knobs{background:#161b16;border-color:#2a2f28}
body.tv footer .ctrl{width:76px;height:76px;font-size:30px;background:#1d231d;color:#f2f4ee;border-color:#3a4038}
body.tv footer .ctrl.primary{background:var(--accent)}
body.tv #nowInfo,body.tv #knobs{font-size:22px;color:#a8ad9e}
body.tv .flab{font-size:20px;color:#a8ad9e}
body.tv select{font-size:22px;padding:8px 12px;background:#1d231d;color:#f2f4ee;border-color:#3a4038}
body.tv .dot{width:24px;height:24px}
body.tv #pausePanel{background:#1a201a;border-color:var(--accent)}
body.tv #pausePanel .pp1{font-size:34px}
body.tv #pausePanel .pp2,body.tv .gen{font-size:20px}
</style>
</head>
<body>
<header>
  <button class="btn sidebtn" id="sideToggle" title="材料/阶段栏">☰</button>
  <h1>🎧 边听边背</h1>
  <select id="matSel"></select>
  <button class="btn" id="btnAdd">＋</button>
  <button class="btn" id="btnEdit">编辑</button>
  <button class="btn" id="btnDel">删除</button>
  <button class="btn rev" id="btnReview">复习</button>
  <button class="btn" id="btnQ" style="display:none">📋 队列</button>
  <div id="progWrap"><span id="progTxt"></span><div id="progBar"><div id="progFill"></div></div></div>
  <div class="spacer"></div>
  <button class="btn" id="btnExp">⬇音频包</button>
  <button class="btn" id="btnImp">⬆导入</button>
  <button class="btn" id="btnPrint" title="打印背诵稿">🖨</button>
  <button class="btn" id="btnFull" title="全屏（F）">⛶</button>
  <button class="btn" id="btnOv" title="总览">📋</button>
  <button class="btn" id="btnSet">⚙</button>
</header>
<div id="stages">
  <button data-s="1" class="on">① 磨耳朵</button>
  <button data-s="2">② 跟读</button>
  <button data-s="3">③ 接背</button>
  <button data-s="4">④ 接龙</button>
  <button data-s="5">⑤ 验收</button>
  <span id="stat" style="margin-left:10px;font-size:13px;color:var(--sub)"></span>
</div>
<div id="pausePanel"><div class="pp1" id="ppTitle">该你了</div><div id="pauseBar"><div id="pauseFill"></div></div><div class="pp2">空格=提前揭晓 · <span id="pauseCd"></span></div></div>
<main id="list">
  <div id="dots"></div>
  <div id="listInner"></div>
</main>
<dialog id="ovDlg"><form class="dlg" method="dialog">
  <h3>总览 · <span id="ovTitle"></span></h3>
  <div id="ovList" style="max-height:62vh;overflow:auto"></div>
  <div class="frow btns"><button class="btn primary" type="submit">关闭</button></div>
</form></dialog>
<!-- 开始界面 -->
<div id="startScreen">
  <div class="ss-box">
    <h1>🎧 边听边背</h1>
    <div class="ss-step">① 选择设备</div>
    <div class="ss-dev">
      <button class="ss-dev-btn on" data-dev="mob">📱 手机</button>
      <button class="ss-dev-btn" data-dev="pc">💻 电脑</button>
    </div>
    <div class="ss-step">② 选择要背诵的内容</div>
    <div class="ss-cats" id="ssCats"></div>
    <div class="ss-list" id="ssList"></div>
    <div class="ss-bar">
      <span id="ssCount">已选 0 篇</span>
      <button class="btn" id="ssAll">全选本类</button>
      <button class="btn primary" id="ssGo" disabled title="先勾选材料">开始练习 ▶</button>
    </div>
    <button class="btn ss-imp" id="ssImp" style="display:none;margin-top:18px">⬆ 导入音频包（离线包）</button>
  </div>
</div>
<aside id="pcSide">
  <div class="ps-head"><span class="ps-logo">🎧 边听边背</span><button class="btn" id="sideClose">✕</button></div>
  <div class="ps-sec">阶段</div>
  <div id="psStages"></div>
  <div class="ps-sec" id="psStat"></div>
  <div class="ps-sec" id="psQueue"></div>
  <div class="ps-sec">材料</div>
  <div id="psMats"></div>
</aside>
<footer>
  <button class="ctrl" id="btnPrev" title="上一句（←）">⏮</button>
  <button class="ctrl primary" id="btnPlay" title="播放/揭晓（空格）">▶</button>
  <button class="ctrl" id="btnNext" title="下一句（→）">⏭</button>
  <button class="ctrl" id="btnReplay" title="重播本句（R）">↻</button>
  <button class="ctrl" id="btnAB" title="本句循环（L）">🔁</button>
  <button class="ctrl" id="btnAuto" title="整篇自动循环">🔄</button>
  <button class="ctrl" id="btnStop" title="停止">⏹</button>
  <span id="nowInfo"></span>
  <div class="spacer"></div>
</footer>
<dialog id="matDlg"><form class="dlg" method="dialog">
  <h3 id="matDlgTitle">新增材料</h3>
  <input id="fTitle" placeholder="标题，如：赤壁赋 / Unit 1 词汇"
    style="width:100%;margin-bottom:8px;padding:8px;border:1px solid var(--line);border-radius:8px">
  <textarea id="fText" rows="12" placeholder="粘贴要背的原文…&#10;回车分段；句末标点处自动分句"
    style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;resize:vertical"></textarea>
  <div class="frow btns">
    <button class="btn primary" id="matSave" type="button">保存</button>
    <button class="btn" type="submit">取消</button>
  </div>
</form></dialog>
<dialog id="setDlg"><form class="dlg" method="dialog">
  <h3>⚙ 设置</h3>
  <div class="frow"><label>TTS 服务</label><input type="text" id="setApi" placeholder="http://192.168.31.57:8899"></div>
  <div class="frow"><label>断点提示</label><select id="setBp"><option value="1">记住每篇进度</option><option value="0">关闭</option></select></div>
  <div class="frow"><label>停顿</label><select id="kGap"><option value="0">连播</option><option value="3">3秒</option><option value="5">5秒</option><option value="8">8秒</option><option value="12">12秒</option><option value="man">手动</option></select></div>
  <div class="frow"><label>遮蔽</label><select id="kMask"><option value="0">全文</option><option value="1">首字</option><option value="2">全遮</option></select></div>
  <div class="frow"><label>语速</label><input type="range" id="kSpd" min="0.6" max="1.5" step="0.05"><span id="kSpdV"></span></div>
  <div class="frow"><label>每句重复</label><select id="kRep"><option value="1">1遍</option><option value="2">2遍</option><option value="3">3遍</option></select></div>
  <div class="frow"><label>长句切分</label><select id="kChunk"><option value="full">整句</option><option value="part">短句</option></select></div>
  <div class="frow"><label>提示比例</label><input type="range" id="kHint" min="0" max="100" step="10"><span id="kHintV"></span></div>
  <div class="frow"><label>存储</label><span id="storeInfo" style="font-size:13px"></span></div>
  <div class="frow btns"><button class="btn" id="btnGc" type="button">清理孤儿缓存</button>
    <button class="btn" id="btnWipe" type="button">清空全部音频</button></div>
  <div class="frow btns">

<script>
/* ================= 工具 ================= */
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);

const LS='recite_v2';
const VOICE='warma_ref_a', KVER='v1';

function fnv(str,seed){let h=seed>>>0;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h}

  return fnv(s,0x811c9dc5).toString(16).padStart(8,'0')+fnv(s,0x01935279).toString(16).padStart(8,'0')}

  const out=[];
  text.replace(/\r\n/g,'\n').split('\n').forEach(line=>{
    line=line.trim(); if(!line)return;
    line.split(/(?<=[。！？；…])|(?<=[.!?;:])\s+/).map(x=>x.trim()).filter(Boolean)
      .forEach(p=>out.push(p));

}
function chunkPrefixes(t){
  if(DB.settings.chunk!=='part')return[];

  if(parts.length<2)return[];
  const out=[];let acc='';
  for(let i=0;i<parts.length-1&&out.length<4;i++){acc+=parts[i];out.push(acc)}

function langOf(t){return isEn(t)?'en':'zh'}
let toastTimer=null;
function toast(msg,ms){const t=$('#toast');t.innerHTML=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),ms||2600)}
/* ================= IndexedDB 音频仓库 ================= */
let idb=null;
function idbOpen(){return new Promise((res,rej)=>{
  const rq=indexedDB.open('recite_audio_v2',1);
  rq.onupgradeneeded=e=>{const db=e.target.result;
    if(!db.objectStoreNames.contains('blobs'))db.createObjectStore('blobs');
    if(!db.objectStoreNames.contains('media'))db.createObjectStore('media');
    if(!db.objectStoreNames.contains('queue'))db.createObjectStore('queue',{keyPath:'id',autoIncrement:true});
    if(!db.objectStoreNames.contains('meta'))db.createObjectStore('meta');};
  rq.onsuccess=e=>{idb=e.target.result;res()};rq.onerror=()=>rej(rq.error)})}
function tx(store,mode,fn){return new Promise((res,rej)=>{
  const t=idb.transaction(store,mode),rq=fn(t.objectStore(store));
  rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error)})}
const blobGet=k=>tx('blobs','readonly',s=>s.get(k));
const blobPut=(k,b)=>tx('blobs','readwrite',s=>s.put({b,ts:Date.now()},k));
const blobDel=k=>tx('blobs','readwrite',s=>s.delete(k));
const blobKeys=()=>tx('blobs','readonly',s=>s.getAllKeys());
const blobCount=()=>tx('blobs','readonly',s=>s.count());
const mediaGet=k=>tx('media','readonly',s=>s.get(k));
const mediaPut=(k,b)=>tx('media','readwrite',s=>s.put(b,k));
const mediaKeys=()=>tx('media','readonly',s=>s.getAllKeys());
const qAll=()=>tx('queue','readonly',s=>s.getAll());
const qAdd=t=>tx('queue','readwrite',s=>s.add(t));
const qPut=t=>tx('queue','readwrite',s=>s.put(t));
const qDel=id=>tx('queue','readwrite',s=>s.delete(id));
function qClear(){return new Promise(res=>{
  try{const t=idb.transaction('queue','readwrite');t.objectStore('queue').clear();t.oncomplete=()=>res();t.onerror=()=>res()}
  catch(e){res()}})}
const metaGet=k=>tx('meta','readonly',s=>s.get(k));
const metaPut=(k,v)=>tx('meta','readwrite',s=>s.put(v,k));
/* ================= 数据 ================= */
function defaults(){return{materials:[],settings:{api:'',speed:1,gap:5,mask:0,rep:1,chunk:'full',
  hint:40,stage:1,bp:1,engine:'server'}}}
function load(){try{const d=JSON.parse(localStorage.getItem(LS));if(d&&d.materials)return d}catch(e){}
  const d=defaults();
  try{const o=JSON.parse(localStorage.getItem('recite_helper_v1'));
    if(o&&o.materials&&o.materials.length){d.materials=o.materials.map(m=>mkMat(m.title||'旧材料',m.text));
      toast('已迁移旧版背诵小助手的材料')}}catch(e){}
  return d}
function mkMat(title,text,items,lang,cat){
  const sents=(items&&items.length)?items.map(x=>({t:x.t,n:x.n||'',tt:x.tt||'',clip:x.clip||'',l:x.l||''})):{};
  const m={id:'m'+Date.now()+Math.floor(Math.random()*999),title:title,lang:lang||(items&&items[0]?langOf(items[0].t):(text?langOf(text):'zh')),
    cat:cat||'',text:text||'',items:sents,ts:Date.now()};
  m.st=(items||[]).map(x=>0);m.lv=(items||[]).map(x=>0);m.nr=(items||[]).map(x=>0);m.bp={stage:1,idx:0};
  return m}
let DB=load(); const save=()=>localStorage.setItem(LS,JSON.stringify(DB));
let matIdx=-1, stage=1, cur=-1, running=false, speakToken=0, abLoop=false;
let dueSet=null, sessionStuck=[], sessionNew=0;
const audio=new Audio(); const urls=new Map(); let curKey='';
const S=()=>DB.materials[matIdx];
const ttsOf=it=>it.tt||it.t;              // 朗读文本（生僻字已做映射），显示用 it.t
const sents=m=>m.tracks?[]:(m.items&&m.items.length?m.items:(m._split||(m._split=splitSentences(m.text).map(t=>({t,n:''})))));
const slen=m=>sents(m).length;
const langOfS=i=>{const it=sents(S())[i];return it.l||langOf(ttsOf(it))};
const keyOfS=(i,pfx)=>keyOf(langOfS(i),(pfx||'')+ttsOf(sents(S())[i]));
function urlFor(k){if(urls.has(k))return urls.get(k);
  const u=URL.createObjectURL(blobCache.get(k));urls.set(k,u);return u}
/* ================= 队列引擎 ================= */
const blobCache=new Map();      // key -> Blob（内存热缓存）
let genBusy=false, genTimer=null, lastGenMs=[], isLeader=false;
function pageBase(){return location.pathname.replace(/[^/]*$/,'')}
function mediaBase(){return (location.protocol.indexOf('http')===0)?(pageBase()+'media/'):'media/'}
function parseApi(){return DB.settings.api||((location.protocol.indexOf('http')===0)?location.origin:'http://192.168.31.57:8899')}
async function genOne(task){
  const t0=Date.now();
  const api=parseApi();
  // 1) 静态托管/离线包：同目录 audio/ 下的预生成文件
  try{const r=await fetch('audio/'+task.key+'.mp3');
    if(r.ok){const b=await r.blob();blobCache.set(task.key,b);await blobPut(task.key,b);
      lastGenMs.push(Date.now()-t0);if(lastGenMs.length>10)lastGenMs.shift();return true}}catch(e){}
  // 2) 家里服务器上的预生成端点
  try{const r=await fetch(api+'/api/audio/'+task.key+'.mp3');
    if(r.ok){const b=await r.blob();blobCache.set(task.key,b);await blobPut(task.key,b);
      lastGenMs.push(Date.now()-t0);if(lastGenMs.length>10)lastGenMs.shift();return true}}catch(e){}
  // 3) 都没有 → 只有连得上本地 TTS 服务器才现场合成
  let alive=false;
  try{const pr=await fetch(api+'/docs');alive=!!pr&&pr.ok}catch(e){alive=false}
  if(!alive)throw new Error('该句音频尚未生成（静态站点无TTS服务）');
  const r=await fetch(api+'/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({text:task.text,lang:task.lang,provider:'sovits',speed:1})});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const ct=r.headers.get('Content-Type')||'audio/mpeg';
  const b=await r.blob();
  blobCache.set(task.key,b);await blobPut(task.key,b);
  lastGenMs.push(Date.now()-t0);if(lastGenMs.length>10)lastGenMs.shift();
  return true}
let apiAliveCache=null, apiAliveAt=0;
async function apiAlive(){
  const now=Date.now();
  if(apiAliveCache!==null && now-apiAliveAt<30000)return apiAliveCache;
  try{const r=await fetch(parseApi()+'/docs');apiAliveCache=!!r&&r.ok}catch(e){apiAliveCache=false}
  apiAliveAt=now;return apiAliveCache}
async function genLoop(){
  if(genBusy)return;
  if(!(await apiAlive())){updateProg();return}   // 静态托管：不做现场生成
  const tasks=await qAll();
  const pend=tasks.filter(t=>t.state===0).sort((a,b)=>(a.prio-b.prio)||(a.id-b.id));
  if(!pend.length){updateProg();return}
  genBusy=true;
  const t=pend[0];t.state=1;await qPut(t);
  try{await genOne(t);t.state=2;await qPut(t);
    if(S()&&t.matId===S().id){renderList();renderStat()}}
  catch(e){t.tries=(t.tries||0)+1;
    if(t.tries>=3){t.state=3}else{t.state=0;t.prio=(t.prio||5)+20}
    await qPut(t);
    if(t.tries>=3)toast('⚠ 一句生成失败：'+e.message,4000)}
  genBusy=false;
  updateProg();
  genTimer=setTimeout(genLoop,200)}
async function enqueue(key,text,lang,matId,prio){
  const tasks=await qAll();
  if(tasks.filter(t=>t.state===0).length>150)return;   // 防止队列膨胀拖慢页面
  if(tasks.some(t=>t.key===key&&t.state!==3))return;
  await qAdd({key,text,lang,matId,prio:prio==null?5:prio,state:0,tries:0})}
async function ensureMat(m,fromIdx){
  const n=slen(m);const from=fromIdx||0;
  for(let i=0;i<n;i++){
    const it=sents(m)[i];
    if(it.clip)return;
    const tt=ttsOf(it),lg=it.l||langOf(tt);
    const kf=keyOf(lg,tt);
    if(!blobCache.has(kf)&&!await blobGet(kf))
      await enqueue(kf,tt,lg,m.id,i<from+3?1:5);
    if(DB.settings.chunk==='part')
      for(const p of chunkPrefixes(tt)){
        const kc=keyOf(lg,p);
        if(!blobCache.has(kc)&&!await blobGet(kc))await enqueue(kc,p,lg,m.id,7)}
  }
  genLoop()}
/* 预取：播放 i 时保证 i+1,i+2 就绪 */
async function prefetch(from){
  if(!S())return;const n=slen(S());
  for(let i=from;i<Math.min(n,from+3);i++){
    const it=sents(S())[i],tt=ttsOf(it),lg=it.l||langOf(tt),k=keyOf(lg,tt);
    if(!blobCache.has(k)&&!await blobGet(k))await enqueue(k,tt,lg,S().id,0)}
  genLoop()}
function updateProg(){
  const m=S();if(!m){$('#progWrap').style.display='none';return}
  const n=slen(m);let have=0;
  for(let i=0;i<n;i++){const it=sents(m)[i];if(it.clip){have++;continue}
    const k=keyOf(it.l||langOf(ttsOf(it)),ttsOf(it));
    if(blobCache.has(k))have++}
  if(have>=n){$('#progWrap').style.display='none';return}
  $('#progWrap').style.display='flex';
  $('#progTxt').textContent='音频 '+have+'/'+n;
  $('#progFill').style.width=(have/n*100)+'%'}
/* ================= 播放引擎 ================= */
const SILENT_WAV='UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
let audioUnlocked=false, unlockEl=null;
function unlockAudio(){ // iOS：必须在用户手势内同步 play 一次，之后才能异步播放
  if(audioUnlocked)return;
  try{
    if(!unlockEl)unlockEl=new Audio();
    unlockEl.src='data:audio/wav;base64,'+SILENT_WAV;
    const p=unlockEl.play();
    if(p&&p.then)p.then(()=>{audioUnlocked=true}).catch(()=>{});
    else audioUnlocked=true;
  }catch(e){}}
document.addEventListener('touchend',unlockAudio,true);
document.addEventListener('click',unlockAudio,true);
function stopAudioOnly(){speakToken++;try{speechSynthesis.cancel()}catch(e){};audio.pause();curKey=''}
function setPlayBtn(){$('#btnPlay').textContent=running?'⏸':'▶'}
async function playKey(k,token){ // 返回 'done'|'missing'|'blocked'
  let b=blobCache.get(k)||await blobGet(k);
  if(!b)return 'missing';
  blobCache.set(k,b);
  return new Promise(res=>{
    if(token!==speakToken)return res('done');
    const url=urlFor(k);
    audio.src=url;audio.playbackRate=+DB.settings.speed||1;
    audio.onended=()=>res('done');audio.onerror=()=>res('done');
    const p=audio.play();
    curKey=k;
    if(p&&p.catch)p.catch(err=>{
      if(err&&err.name==='NotAllowedError'){audioUnlocked=false;
        toast('🔇 Safari 拦截了声音：请再点一次 ▶',4000);
        res('blocked')}
      else res('done')})})}
async function playIndex(i,rep){
  if(matIdx<0)return;const m=S();if(i<0||i>=slen(m))return;
  const _it=sents(m)[i];
  if(_it&&_it.clip){playClipChain(i);return}   // 原声片段材料：直接播片段并连播
  stopAudioOnly();
  const tk=++speakToken;
  cur=i;renderList();renderDots();saveBp();
  const it=sents(m)[i],lg=it.l||langOf(ttsOf(it));
  running=true;setPlayBtn();
  const k=keyOf(lg,ttsOf(it));
  let b=blobCache.get(k)||await blobGet(k);
  if(!b&&tk===speakToken){toast('这句还没生成，正在排队…');
    await enqueue(k,it.t,lg,m.id,0);genLoop();
    for(let w=0;w<600&&tk===speakToken;w++){await new Promise(r=>setTimeout(r,300));
      b=blobCache.get(k)||await blobGet(k);if(b)break}}
  markSpeaking(i);
  const reps=rep||+DB.settings.rep||1;
  for(let r=0;r<reps;r++){
    if(tk!==speakToken)return;
    const res=await playKey(k,tk);
    if(res==='missing'){toast('⚠ 音频不可用（TTS 服务未启动？）',4000);running=false;setPlayBtn();return}
    if(res==='blocked'){stopAudioOnly();running=false;setPlayBtn();return}}
  if(tk!==speakToken)return;
  markSpeaking(-1);
  if(abLoop){playIndex(cur,rep);return}
  running=false;setPlayBtn();
  afterSentence()}
/* ---- 阶段推进 ---- */
let pauseAbort=null;
function showPause(sec,onDone){
  const p=$('#pausePanel');p.style.display='block';
  const total=sec;
  $('#pauseFill').style.transition='none';$('#pauseFill').style.width='100%';
  const t0=Date.now();
  const tick=()=>{const el=(Date.now()-t0)/1000;
    $('#pauseFill').style.transition='width .2s linear';
    $('#pauseFill').style.width=Math.max(0,100-el/total*100)+'%';
    $('#pauseCd').textContent=Math.max(0,Math.ceil(total-el))+' 秒';
    if(el>=total){p.style.display='none';onDone()}};
  $('#pauseCd').textContent=total+' 秒';
  requestAnimationFrame(tick);
  const iv=setInterval(tick,200);
  pauseAbort=()=>{clearInterval(iv);p.style.display='none'}}
function hidePause(){if(pauseAbort)pauseAbort();pauseAbort=null;
  const p=$('#pausePanel');if(p)p.style.display='none'}
async function afterSentence(){
  if(!S())return;const m=S();
  const n=slen(m);
  const done=()=>{running=false;setPlayBtn();
    if(DB.settings.autoLoop){setTimeout(()=>playIndex(0),700);return}
    sessionEnd();qAdvance()};
  const g=String(DB.settings.gap);
  if(stage===1){ // 磨耳朵：连播
    if(cur<n-1){playIndex(cur+1)}else done();
    return}
  if(stage===2||stage===3){ // 跟读/接背：句读停顿
    if(g==='man'){running=false;setPlayBtn();showPause(999,()=>{});return}
    const sec=+g||0;
    if(cur<n-1){
      if(sec>0)showPause(sec,()=>playIndex(cur+1));
      else playIndex(cur+1);
    }else done();
    return}
  if(stage===4){ // 接龙：揭晓→标记→下一句
    await markPrompt();
    return}}
function tokenGone2(tk){return tk!==speakToken}
/* 接龙主流程 */
async function chainStart(from){
  if(matIdx<0)return;const m=S();const seq=dueSet||range(slen(m),from||0);
  chainStart.seq=seq;chainStart.pos=0;chainStart.tk=++speakToken;
  hidePause();chainStart.waitMark=false;
  running=true;setPlayBtn();chainStep()}
function range(n,from){const a=[];for(let i=from||0;i<n;i++)a.push(i);return a}
async function chainStep(){
  const seq=chainStart.seq;if(!seq)return;
  if(chainStart.pos>=seq.length){chainEnd();return}
  const i=seq[chainStart.pos];
  cur=i;renderList();saveBp();
  // 1) 提示音（hint>0 时播前缀）
  const hint=+DB.settings.hint||0;
  if(hint>0){
    const pfxs=chunkPrefixes(sents(S())[i].t);
    if(pfxs.length){
      const want=Math.min(pfxs.length,Math.max(1,Math.round(pfxs.length*hint/100)));
      const pk=keyOf(langOfS(i),pfxs[want-1]);
      let b=blobCache.get(pk)||await blobGet(pk);
      if(!b){await enqueue(pk,pfxs[want-1],langOfS(i),S().id,0);genLoop()}
      else{running=true;setPlayBtn();await playKey(pk,speakToken);if(speakToken!==chainStart.tk)return}}
    else await playIndex(i,1) // 没有切分点就播整句当提示
  }
  // 2) 该你背：倒计时
  const g=String(DB.settings.gap),sec=g==='man'?30:(+g||8);
  $('#pausePanel').style.display='block';
  $('#ppTitle').textContent='该你了 —— 背第 '+(i+1)+' 句';
  $('#pausePanel').querySelector('.pp2').innerHTML='空格=提前揭晓 · <span id="pauseCd"></span>';
  showPause(sec,()=>chainReveal(i));
}
async function chainReveal(i){
  hidePause();
  $('#ppTitle')&&0;
  running=true;setPlayBtn();
  await playIndex(i,1);
  await markPrompt()}
function markPrompt(){ // 揭晓后等 顺/卡
  running=false;setPlayBtn();

  chainStart.waitMark=true}
function markResult(ok){
  chainStart.waitMark=false;hideToast();
  const m=S(),i=cur;if(!m||i<0)return;
  if(ok){if(m.st[i]!==2){sessionNew++;m.st[i]=2}
    m.lv[i]=Math.min(6,(m.lv[i]||0)+1);
    const gap=[0,1,2,4,7,15,30];m.nr[i]=Date.now()+gap[m.lv[i]]*864e5;
  }else{m.st[i]=1;m.lv[i]=0;m.nr[i]=Date.now()+864e5;sessionStuck.push(i)}

function chainEnd(){

function hideToast(){const t=$('#toast');t.classList.remove('show');clearTimeout(toastTimer)}
/* ---- 会话小结 ---- */
function sessionEnd(){

      +sessionStuck.length+'</b> 句'+(sessionStuck.length?'：<br>'+sessionStuck.map(i=>'#'+(i+1)+' '+esc(sents(S())[i].t)).join('<br>'):'');
    $('#sumDlg').showModal()}

/* 播放提供的原声片段（逐词/逐句） */
function playClip(clip,onEnd){
  if(!clip)return;
  const base=mediaBase();
  stopAudioOnly();running=true;setPlayBtn();
  audio.src=base+clip;audio.playbackRate=+DB.settings.speed||1;
  audio.onended=()=>{running=false;setPlayBtn();if(onEnd)onEnd()};
  const p=audio.play();
  if(p&&p.catch)p.catch(()=>{running=false;setPlayBtn()});
}
function playClipChain(i){
  const m=S();if(!m||i<0||i>=slen(m))return;
  const its=sents(m);
  if(!its[i]||!its[i].clip){running=false;setPlayBtn();return}
  playClip(its[i].clip,()=>{
    if(i+1<slen(m)&&its[i+1].clip)playClipChain(i+1);
    else{running=false;setPlayBtn();cur=-1;$('#nowInfo').textContent=''}}
  );

/* ================= 渲染 ================= */
function maskHTML(t,mode){
  const en=isEn(t);
  if(mode===0)return esc(t);
  if(mode===2)return en?'<span class="gap" data-full="'+esc(t)+'">'+'_'.repeat(Math.min(t.split(/\s+/).length,18))+'</span>'

function lcsMark(a,b){
  const mm=a.length,n=b.length,dp=Array.from({length:mm+1},()=>new Uint16Array(n+1));
  for(let i=mm-1;i>=0;i--)for(let j=n-1;j>=0;j--)
    dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  let i=0,j=0;const seq=[];
  while(i<mm&&j<n){
    if(a[i]===b[j]){seq.push({c:b[j],ok:1});i++;j++}
    else if(dp[i+1][j]>=dp[i][j+1]){seq.push({c:a[i],miss:1});i++}
    else{seq.push({c:b[j],extra:1});j++}}
  while(i<mm){seq.push({c:a[i],miss:1});i++}
  while(j<n){seq.push({c:b[j],extra:1});j++}
  return seq}
function checkDict(i,m){
  const s=sents(m)[i].t;
  const input=(document.querySelector('.dinput[data-i="'+i+'"]').value||'').trim();
  const res=document.querySelector('.dresult[data-i="'+i+'"]');
  if(!input){res.textContent='先写点什么再校对哦';return}
  let html,stat;
  if(isEn(s)){
    const norm=t=>t.toLowerCase().replace(/[^a-z0-9' ]/g,' ').split(/\s+/).filter(Boolean);
    const seq=lcsMark(norm(s),norm(input));
    html=seq.map(x=>x.ok?'<span class="ok">'+esc(x.c)+'</span>'
      :x.miss?'<span class="miss">['+esc(x.c)+']</span>':'<span class="bad">'+esc(x.c)+'</span>').join(' ');
    stat='对 '+seq.filter(x=>x.ok).length+' / 漏 '+seq.filter(x=>x.miss).length+' / 错多 '+seq.filter(x=>x.extra).length;
  }else{
    const A=[...s].filter(c=>/[\u4e00-\u9fa5A-Za-z0-9]/.test(c));
    const B=[...input].filter(c=>/[\u4e00-\u9fa5A-Za-z0-9]/.test(c));
    const seq=lcsMark(A,B);
    html=seq.map(x=>x.ok?'<span class="ok">'+esc(x.c)+'</span>'
      :x.miss?'<span class="miss">＿</span>':'<span class="bad">'+esc(x.c)+'</span>').join('');
    stat='对 '+seq.filter(x=>x.ok).length+' / 漏 '+seq.filter(x=>x.miss).length+' / 错多 '+seq.filter(x=>x.extra).length}
  res.innerHTML=html+'<div class="dstat">'+stat+'</div>'}

async function preloadMaterial(m){
  if(!m||m.tracks)return;
  const api=parseApi();
  const list=[];
  const n=slen(m);
  for(let i=0;i<n;i++){const it=sents(m)[i];if(it.clip)continue;const tt=ttsOf(it);const lg=it.l||langOf(tt);
    list.push([keyOf(lg,tt),tt,lg,i])}
  $('#progWrap').style.display='flex';
  let done=0;const total=list.length;const t0=Date.now();
  const worker=async()=>{
    while(list.length){
      const [k,t,lg]=list.shift();
      if(!blobCache.has(k)){
        try{let b=null;
          const idb=await blobGet(k);
          if(idb&&idb.b)b=idb.b;

            if(r2.ok)b=await r2.blob()}
          if(b){blobCache.set(k,b);blobPut(k,b)}
        }catch(e){}}
      done++;
      $('#progTxt').textContent='加载 '+done+'/'+total;
      $('#progFill').style.width=(done/total*100)+'%';
      if(done>=total){setTimeout(()=>{updateProg()},800)}}};
  await Promise.all([worker(),worker(),worker(),worker(),worker(),worker()])}

    for(let i=0;i<nc;i++)cl[O[i]]=bits(3);
    const clh=build(cl);
    const lens=new Array(nl+nd).fill(0);
    let i=0;
    while(i<nl+nd){
      const s=decode(clh);
      if(s<16)lens[i++]=s;
      else if(s===16){const p=lens[i-1],r=3+bits(2);while(r--)lens[i++]=p}
      else if(s===17){const r=3+bits(3);while(r--)lens[i++]=0}
      else{const r=11+bits(7);while(r--)lens[i++]=0}}
    block(build(lens.slice(0,nl)),build(lens.slice(nl)))}
  for(;;){
    const last=bits(1),ty=bits(2);
    if(ty===0){bitbuf=0;bitcnt=0;
      const len=u8[pos]|(u8[pos+1]<<8);pos+=4;
      for(let i=0;i<len;i++)emit(u8[pos++])}
    else if(ty===1){
      const ll=new Array(288).fill(8);for(let i=144;i<256;i++)ll[i]=9;for(let i=256;i<280;i++)ll[i]=7;for(let i=280;i<288;i++)ll[i]=8;
      block(build(ll),build(new Array(30).fill(5)))}
    else if(ty===2)dynBlock();
    else throw new Error('bad block');
    if(last)break}
  return outBuf.subarray(0,ol)}
function unzip(u8){
  const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);
  // 找 EOCD
  let e=-1;
  for(let i=u8.length-22;i>=Math.max(0,u8.length-66000);i--)
    if(dv.getUint32(i,true)===0x06054b50){e=i;break}
  if(e<0)throw new Error('不是 zip');
  const n=dv.getUint16(e+10,true);let off=dv.getUint32(e+16,true);
  const files=[];
  const td=new TextDecoder();
  for(let i=0;i<n;i++){
    if(dv.getUint32(off,true)!==0x02014b50)break;
    const method=dv.getUint16(off+10,true),csize=dv.getUint32(off+20,true);
    const nl=dv.getUint16(off+28,true),el=dv.getUint16(off+30,true),cl=dv.getUint16(off+32,true);
    const lho=dv.getUint32(off+42,true);
    const name=td.decode(u8.subarray(off+46,off+46+nl));
    const lnl=dv.getUint16(lho+26,true),lel=dv.getUint16(lho+28,true);
    const dstart=lho+30+lnl+lel;
    let data=u8.subarray(dstart,dstart+csize);
    if(method===8)data=inflate(data);
    files.push({name,data});
    off+=46+nl+el+cl}
  return files}
async function exportPack(all){
  const mats=all?DB.materials:[S()].filter(Boolean);
  if(!mats.length){toast('没有材料');return}
  toast('正在打包…');
  const enc=new TextEncoder();const entries=[];
  const manifest={v:1,voice:VOICE,materials:[]};
  for(const m of mats){
    if(m.tracks){
      const files=[];
      for(const t of m.tracks){
        let b=await mediaGet(t.file);
        if(!b){try{const r=await fetch(m.baseURL+t.file);if(r.ok){b=await r.blob();await mediaPut(t.file,b)}}catch(e){}}
        if(b)entries.push({name:'media/'+t.file,data:new Uint8Array(await b.arrayBuffer())});
        files.push({t:t.t,file:t.file})}
      manifest.materials.push({id:m.id,title:m.title,cat:m.cat,tracks:files});
      continue}
    const items=sents(m).map(it=>({t:it.t,n:it.n||''}));
    manifest.materials.push({id:m.id,title:m.title,cat:m.cat,lang:m.lang,text:m.text,items,
      st:m.st,lv:m.lv,nr:m.nr});
    for(const it of items){const tt=it.tt||it.t;const lg=it.l||langOf(tt);
      const put=async k=>{const b=blobCache.get(k)||await blobGet(k);
        if(b)entries.push({name:'audio/'+k+'.mp3',data:new Uint8Array(await b.arrayBuffer())})};
      await put(keyOf(lg,tt));
      for(const p of chunkPrefixes(tt))await put(keyOf(lg,p))}}
  entries.push({name:'manifest.json',data:enc.encode(JSON.stringify(manifest))});
  const blob=makeZip(entries);
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='recite-pack-'+(all?'all':S().title.replace(/[\\/:*?"<>|]/g,''))+'-'+new Date().toISOString().slice(0,10)+'.zip';
  a.click();toast('📦 已导出 '+entries.length+' 个文件')}
$('#btnExp').onclick=async()=>{
  if(!DB.materials.length)return;
  exportPack(confirm('确定=导出全部材料（含课本听力），取消=只导当前一篇'))};
$('#btnImp').onclick=()=>{
  const inp=document.createElement('input');inp.type='file';inp.accept='.zip';
  inp.onchange=async()=>{const f=inp.files[0];if(!f)return;
    try{toast('解压导入中…');
      const u8=new Uint8Array(await f.arrayBuffer());
      const files=unzip(u8);
      const mf=files.find(x=>x.name==='manifest.json');
      if(!mf)throw new Error('清单缺失');
      const man=JSON.parse(new TextDecoder().decode(mf.data));
      let na=0;
      for(const e of files){
        if(e.name.startsWith('audio/')){const k=e.name.slice(6).replace('.mp3','');
          const b=new Blob([e.data],{type:'audio/mpeg'});
          blobCache.set(k,b);await blobPut(k,b);na++}
        else if(e.name.startsWith('media/')){const k=e.name.slice(6);
          await mediaPut(k,new Blob([e.data],{type:'audio/mpeg'}))}}
      const news=[];
      for(const x of man.materials){
        if(x.tracks){
          const mm={id:x.id,title:x.title,cat:x.cat||'课本听力',tracks:x.tracks,baseURL:mediaBase()};
          // 离线导入：把包内 media/ 的音频装进 IndexedDB 并生成可播放 URL
          try{
            const urls=[];
            for(const t of mm.tracks){const b=await mediaGet(t.file);
              urls.push(b?URL.createObjectURL(b):(mm.baseURL+t.file))}
            mm._urls=urls;
          }catch(e){}
          news.push(mm)}
        else{const m=mkMat(x.title,'',x.items,x.lang,x.cat);m.id=x.id;
          if(x.st){m.st=x.st;m.lv=x.lv||m.lv;m.nr=x.nr||m.nr}
          news.push(m)}}
      DB.materials=news;matIdx=0;save();renderSel();
      toast('✅ 导入完成：'+news.length+' 篇 / '+na+' 段音频',4000)}
    catch(e){toast('❌ 导入失败：'+e.message,4000)}};
  inp.click()};
